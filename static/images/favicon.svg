<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">SeePhys Pro favicon</title>
  <desc id="desc">A small crayon-style SeePhys Pro icon.</desc>
  <defs>
    <filter id="crayon" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="paper" x1="7" x2="57" y1="6" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE7A9"/>
      <stop offset="0.55" stop-color="#DFF2FF"/>
      <stop offset="1" stop-color="#E4F5DC"/>
    </linearGradient>
  </defs>

  <rect x="5" y="5" width="54" height="54" rx="16" fill="url(#paper)"/>
  <rect x="5" y="5" width="54" height="54" rx="16" fill="none" stroke="#B8C4D4" stroke-opacity="0.55"/>

  <g filter="url(#crayon)" fill="none" stroke-linecap="round">
    <path d="M16 42 C26 30, 38 26, 50 21" stroke="#C64E45" stroke-width="6" stroke-opacity="0.82"/>
    <path d="M15 45 C27 34, 38 31, 50 27" stroke="#2F8F69" stroke-width="5" stroke-opacity="0.72"/>
    <path d="M18 48 C30 40, 40 37, 49 34" stroke="#3E86BD" stroke-width="4" stroke-opacity="0.68"/>
  </g>

  <text x="31.5" y="34.5"
        text-anchor="middle"
        font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive"
        font-size="25"
        font-weight="700"
        fill="#1F2937"
        opacity="0.88"
        filter="url(#crayon)">S</text>
</svg>
